<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata - Free Invoice</title>
<style>
body{font-family:sans-serif;padding:15px;background:#f5f5f5}
.box{background:white;padding:15px;border-radius:10px;max-width:500px;margin:auto}
input{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:5px;box-sizing:border-box}
button{width:100%;padding:12px;background:#000;color:#fff;border:0;border-radius:8px;margin-top:10px;font-size:16px}
.receipt{margin-top:15px;border-top:2px dashed #000;padding-top:10px}
@media print{button{display:none}}
</style>
</head>
<body>
<div class="box">
<h2>Strata Invoice - Free</h2>
<input id="client" placeholder="Client Name">
<input id="service" placeholder="Service / Product">
<input id="amount" placeholder="Amount - e.g. 500" type="number">
<input id="date" type="date">
<button onclick="make()">Create Receipt</button>
<div id="out"></div>
<button onclick="window.print()" style="background:#444">Print / Save as PDF</button>
</div>
<script>
function make(){
let c=document.getElementById('client').value;
let s=document.getElementById('service').value;
let a=document.getElementById('amount').value;
let d=document.getElementById('date').value;
if(!c||!a){alert('Add client and amount');return}
document.getElementById('out').innerHTML=`
<div class=receipt>
<h3>RECEIPT</h3>
<p><b>Client:</b> ${c}</p>
<p><b>Service:</b> ${s}</p>
<p><b>Date:</b> ${d}</p>
<p><b>Amount:</b> R ${a}</p>
<p>Paid - Thank you!</p>
<small>Strata-invoice-free</small>
</div>`;
localStorage.setItem('last',document.getElementById('out').innerHTML);
}
</script>
</body>
</html>
